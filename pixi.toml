[workspace]
name = "cyberpunk-head-tracking"
description = "Head tracking mod for Cyberpunk 2077 using OpenTrack"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

# Platform-independent tasks. Everything below in [target.*.tasks] either
# builds the Windows payload or refuses to.
[tasks]
# Fetch/refresh submodules (CameraUnlock standard task). The first pass covers
# BOTH submodules so a fresh clone can build - native/deps/RED4ext.SDK is a
# hard build dependency (CMakeLists.txt aborts without it). The second pass
# then advances cameraunlock-core to its remote tip.
sync = { cmd = "git submodule update --init --recursive && git submodule update --remote cameraunlock-core" }

# Restore/setup any prerequisites (alias of sync for this project; no package dependencies)
setup = { depends-on = ["sync"] }
restore = { depends-on = ["sync"] }

# Lua self-tests. Needs a `lua` interpreter on PATH; the CET sandbox isn't
# involved, the tests stub the globals they need. Each suite runs as its own
# process so one suite's global stubs can't leak into the next.
test-syntax   = { cmd = "lua tests/syntax_test.lua" }
test-settings = { cmd = "lua tests/settings_test.lua" }
test-console  = { cmd = "lua tests/console_api_test.lua" }
test-delegate = { cmd = "lua tests/delegate_equivalence_test.lua" }
test-aim      = { cmd = "lua tests/aim_compensation_test.lua" }
test-pose     = { cmd = "lua tests/poseinterpolator_test.lua" }
test-state    = { cmd = "lua tests/state_gate_test.lua" }
test = { depends-on = ["test-syntax", "test-settings", "test-console", "test-delegate", "test-aim", "test-pose", "test-state"] }

[target.win-64.tasks]
# Build native RED4ext C++ plugin
build-native = { cmd = "native\\build.bat" }
build = { depends-on = ["build-native"] }
# Alias for the CameraUnlock C++ primary-build name. NightlyRelease.psm1
# defaults to `pixi run build-release`; without this, a nightly cut with the
# module's default BuildCommand would fail on an unknown task.
build-release = { depends-on = ["build-native"] }

# Deploy to CET mods folder (Windows only). Depends on `build` so the native
# RED4ext DLL is rebuilt before copying - otherwise `pixi run install` would
# silently ship a stale DLL with the Lua changes, which is exactly how the
# TCP-port-mismatch bug slipped through.
deploy = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }
install = { depends-on = ["deploy"] }

# Uninstall the deployed mod
uninstall = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/uninstall.ps1" }

# Validate release readiness (run before tagging)
validate-release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/validate-release.ps1" }

# Print the installed game EXE's PE fingerprint plus a paste-ready build-profile
# stub. First thing to run when a user reports the "unknown build" log line, and
# step one of a rederive after a game patch.
check-fingerprint = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1" }

# Package release ZIPs (installer + Nexus). Depends on `build` so the
# bundled native DLL is always rebuilt before zipping - this is the chain
# described in cameraunlock-core/AGENTS.md (`package` -> `build`). The
# vendored CET + RED4ext loaders are committed under vendor/ and bundled
# into the ZIP by package-release.ps1.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build"] }

# Automated release workflow
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

# Clean build artifacts
clean = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/clean.ps1" }

# Refresh vendored CET + RED4ext loaders from upstream (manual; commit after).
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

[target.linux-64.tasks]
# Everything that touches the payload is Windows-only and fails fast here.
# The package this repo ships is a Windows RED4ext DLL plus a CET Lua tree, so
# no Linux task can produce a correct artifact. The previous wiring pointed
# `package` / `release` / `validate-release` at scripts/*.sh - a second,
# drifting copy of the build that emitted a single Lua-only
# dist/HeadTracking-v<version>.zip with no native DLL, no vendored loaders, no
# TweakXL yaml and no Nexus ZIP. A wrong artifact is worse than no artifact.
build = { cmd = "echo 'build requires Windows (MSVC-built RED4ext plugin)' && exit 1" }
build-release = { depends-on = ["build"] }
deploy = { cmd = "echo 'deploy requires Windows (Cyberpunk 2077 is a Windows game)' && exit 1" }
install = { depends-on = ["deploy"] }
uninstall = { cmd = "echo 'uninstall requires Windows' && exit 1" }
validate-release = { cmd = "echo 'validate-release requires Windows' && exit 1" }
package = { cmd = "echo 'package requires Windows (bundles an MSVC-built RED4ext plugin)' && exit 1" }
release = { cmd = "echo 'release requires Windows' && exit 1" }
update-deps = { cmd = "echo 'update-deps requires Windows (CET/RED4ext/TweakXL loaders)' && exit 1" }
check-fingerprint = { cmd = "echo 'check-fingerprint requires Windows (reads the installed game EXE)' && exit 1" }

# Clean build artifacts
clean = { cmd = "rm -rf dist release native/build native/out && echo 'Build artifacts cleaned'" }

[dependencies]
# No pixi dependencies needed - Lua mod uses CET runtime
