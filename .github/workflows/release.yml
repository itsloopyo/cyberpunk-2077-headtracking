name: Release
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Require release announcement prerequisites
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          LOPARI_APP_ACTIONS_TOKEN: ${{ secrets.LOPARI_APP_ACTIONS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - every release must be announced to Discord, so this run is refused before the release is created. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo $env:REPO' and re-run."
            exit 1
          }
          $bust = "cb$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          $mods = (Invoke-RestMethod "https://lopari.app/mods.json?$bust").mods
          $entry = @($mods) | Where-Object { $_.repo -eq $env:REPO }
          if ($entry -and -not $env:LOPARI_APP_ACTIONS_TOKEN) {
            Write-Host "::error::$env:REPO is in the Lopari catalog but LOPARI_APP_ACTIONS_TOKEN is not set - the catalog pin can't be synced before the announcement, so the Run in Lopari link would serve the previous release. Set the fine-grained PAT (Actions:write on itsloopyo/lopari.app only) and re-run."
            exit 1
          }
          Write-Host "Release announcement prerequisites present."

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Extract version from tag
        id: version
        shell: pwsh
        # Context values go through env, never string-interpolated into the
        # script body: a tag name may contain quotes and $(...), and this job
        # holds contents:write plus the Discord and Lopari secrets.
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            Write-Host "::error::Tag format invalid. Use semantic versioning: v1.2.3 (got: $tag)"
            exit 1
          }
          $version = $matches[1]
          "tag=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag"
          Write-Host "Version: $version"

      - name: Validate version matches scripts/install.cmd MOD_VERSION
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installCmd = 'scripts/install.cmd'
          if (-not (Test-Path $installCmd)) {
            Write-Host "::error::Canonical version source not found: $installCmd"
            exit 1
          }
          $installRaw = Get-Content -Raw $installCmd
          if ($installRaw -notmatch 'set "MOD_VERSION=([^"]+)"') {
            Write-Host "::error::MOD_VERSION line not found in $installCmd"
            exit 1
          }
          $cmdVersion = $matches[1]
          if ($cmdVersion -ne $env:VERSION) {
            Write-Host "::error::Tag version ($env:VERSION) does not match MOD_VERSION in ${installCmd} ($cmdVersion)"
            exit 1
          }
          Write-Host "OK MOD_VERSION in $installCmd matches tag: $env:VERSION"

      # C++ toolchain for the pixi `package` task's native cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v3

      # run-install: false skips setup-pixi's `pixi install` + `pixi list`
      # verification. This project's pixi environment has zero conda
      # dependencies (native RED4ext/Lua mod; pixi is only a task runner), and
      # pixi 0.70+ exits 1 when `pixi list` finds an empty environment. The
      # build step below self-installs the environment via `pixi run`.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      # Same command as build.yml and developers run - no build logic in YAML.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Generate release notes
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $artifactPaths = @(
            'init.lua',
            'modules',
            'native/src',
            'native/CMakeLists.txt',
            'cameraunlock-core',
            'scripts/install.cmd',
            'scripts/uninstall.cmd'
          )
          & cameraunlock-core/scripts/generate-release-notes.ps1 `
            -Version $env:VERSION `
            -ArtifactPaths $artifactPaths `
            -ProjectName "Cyberpunk 2077 HeadTracking"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Release notes generation failed"
            exit 1
          }

      - name: Find release ZIPs
        id: zips
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = "release/HeadTracking-v$env:VERSION-installer.zip"
          $nexus     = "release/HeadTracking-v$env:VERSION-nexus.zip"
          if (-not (Test-Path $installer)) {
            Write-Host "::error::Installer ZIP missing: $installer"
            exit 1
          }
          if (-not (Test-Path $nexus)) {
            Write-Host "::error::Nexus ZIP missing: $nexus"
            exit 1
          }
          Write-Host "OK $installer"
          Write-Host "OK $nexus"
          "installer=$installer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "nexus=$nexus"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          INSTALLER_ZIP: ${{ steps.zips.outputs.installer }}
          NEXUS_ZIP: ${{ steps.zips.outputs.nexus }}
        shell: pwsh
        run: |
          Write-Host "Creating GitHub Release for $env:TAG..." -ForegroundColor Cyan
          gh release create $env:TAG `
            --title "Cyberpunk 2077 HeadTracking $env:TAG" `
            --notes-file release-notes.txt `
            $env:INSTALLER_ZIP `
            $env:NEXUS_ZIP
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to create GitHub release"
            exit 1
          }
          Write-Host "Release created: https://github.com/$env:REPO/releases/tag/$env:TAG" -ForegroundColor Green

      - name: Sync Lopari catalog pin
        shell: pwsh
        env:
          LOPARI_APP_ACTIONS_TOKEN: ${{ secrets.LOPARI_APP_ACTIONS_TOKEN }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $repo = $env:REPO
          $version = $env:TAG_NAME -replace '^v', ''
          function Get-PinnedVersion {
            $bust = "cb$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
            $mods = (Invoke-RestMethod "https://lopari.app/mods.json?$bust").mods
            $entry = @($mods) | Where-Object { $_.repo -eq $repo }
            if (-not $entry) { return $null }
            return @{ inCatalog = $true; pinned = $entry.release.pinned.version }
          }
          $state = Get-PinnedVersion
          if (-not $state) {
            Write-Host "::notice::$repo has no Lopari catalog entry - the announce link will use the /run/ page's GitHub fallback."
            exit 0
          }
          if ($state.pinned -eq $version) {
            Write-Host "Catalog already pins $version."
            exit 0
          }
          Invoke-RestMethod -Method Post `
            -Uri 'https://api.github.com/repos/itsloopyo/lopari.app/actions/workflows/update-pins.yml/dispatches' `
            -Headers @{ Authorization = "Bearer $env:LOPARI_APP_ACTIONS_TOKEN"; Accept = 'application/vnd.github+json' } `
            -ContentType 'application/json' -Body '{"ref":"main"}'
          Write-Host "Requested lopari.app catalog re-pin; waiting for $version to go live..."
          $deadline = [DateTime]::UtcNow.AddMinutes(10)
          while ([DateTime]::UtcNow -lt $deadline) {
            Start-Sleep -Seconds 15
            try {
              $state = Get-PinnedVersion
            } catch {
              # A transient fetch failure is part of what the poll absorbs;
              # a persistent one runs into the deadline below.
              continue
            }
            if ($state.pinned -eq $version) {
              Write-Host "Catalog pin is live: $version."
              exit 0
            }
            Write-Host "  still pinned at $($state.pinned)..."
          }
          Write-Host "::error::Timed out waiting for lopari.app to pin $version (still $($state.pinned)). Check https://github.com/itsloopyo/lopari.app/actions, then re-run this job - the release exists; only the pin sync and announcement are pending."
          exit 1

      - name: Announce release to Discord
        shell: pwsh
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if (-not $env:DISCORD_RELEASE_WEBHOOK) {
            Write-Host "::error::DISCORD_RELEASE_WEBHOOK secret is not set - the release was created but not announced. Set it with 'gh secret set DISCORD_RELEASE_WEBHOOK --repo $env:REPO' and re-run this job."
            exit 1
          }
          $tag  = $env:TAG_NAME
          $repo = $env:REPO
          $name = (Get-Culture).TextInfo.ToTitleCase(((($repo -split '/')[-1]) -replace '-head-?tracking$','' -replace '-',' '))
          $url  = "https://github.com/$repo/releases/tag/$tag"
          $payload = @{
            username = 'Mod Releases'
            embeds   = @(@{
              title       = "$name Head Tracking $tag"
              url         = $url
              description = "A new release of **$name Head Tracking** is live.`n`n**[Download the $tag release]($url)**`n**[Run in Lopari](https://lopari.app/run/?repo=$repo)**"
              color       = 5814783
            })
          } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Uri $env:DISCORD_RELEASE_WEBHOOK -Method Post -ContentType 'application/json' -Body $payload
          Write-Host "Announced $tag to Discord."
