name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.millhouse/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.millhouse/**'

# This job builds pull-request branches, so it gets the read-only token rather
# than whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # C++ toolchain for the pixi `package` task's native cmake/msbuild build.
      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@v3

      # run-install: false skips setup-pixi's `pixi install` + `pixi list`
      # verification. This project's pixi environment has zero conda
      # dependencies (native RED4ext/Lua mod; pixi is only a task runner), and
      # pixi 0.70+ exits 1 when `pixi list` finds an empty environment. The
      # build step below self-installs the environment via `pixi run`.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (build-native -> package);
      # the workflow owns none, so local and CI can't drift.
      - name: Build and package
        shell: pwsh
        run: pixi run package

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
